<div class="app-shell">
  <header class="app-header">
    <span class="brand">Activity Manager</span>
    <span class="tagline">tudo salvo localmente em data.json</span>
    <button
      type="button"
      class="settings-btn jira-btn"
      (click)="openJira()"
      aria-label="Abrir Jira"
      title="Jira"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <g transform="rotate(45 12 12)">
          <rect x="9.5" y="9.5" width="9" height="9" rx="2" fill="#0052CC" />
          <rect x="6.5" y="6.5" width="9" height="9" rx="2" fill="#2684FF" />
          <rect x="3.5" y="3.5" width="9" height="9" rx="2" fill="#B3D4FF" />
        </g>
      </svg>
    </button>
    <button
      type="button"
      class="settings-btn"
      (click)="openSettings()"
      aria-label="Configurar seções visíveis"
    >
      <mat-icon>settings</mat-icon>
    </button>
  </header>

  <main class="app-content">
    @for (key of layout.visibleOrder(); track key) {
      @switch (key) {
        @case ('credentials') {
          <app-credentials-section />
        }
        @case ('shortcuts') {
          <app-shortcuts-page />
        }
        @case ('messages') {
          <app-messages-section />
        }
        @case ('activities') {
          <app-activities-page />
        }
      }
    }
  </main>
</div>
